      limit:    {role: limit, default: 100, max: 100}
      offset:   {role: offset}
      ordering: {role: ignore}

  # ---- CDC tables: bounded updated_at-range reads ----

  - path: /public/v2/journal-entries/
    method: GET
    corpus: journal_entries
    response:
      pagination_style: offset_limit
      wrapper:
        records_key: items
    params:
      limit:          {role: limit, default: 100, max: 100}
      offset:         {role: offset}
      ordering:       {role: ignore}
      updated_after:  {role: filter, field: updated_at, op: gte}
      updated_before: {role: filter, field: updated_at, op: lte}
    synthesize_future_records:
      cursor_field: updated_at
      count: 3

