# HubSpot Extended pipeline spec — 47 streams -> ingestion.hubspot  (pipeline name: ingestion_hubspot)
# Connection is a COMMUNITY connection holding a HubSpot Private App access token.
# Some streams require higher HubSpot tiers (Marketing/Service/CMS/Commerce Hub); those
# will fail with 402/403 if your portal lacks the module — see DEPLOY.md 'Trim' section.
connection_name: hubspot_extended
objects:
